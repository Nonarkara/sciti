name: Refresh baseline
on:
  schedule:
    - cron: "0 21 * * 1"
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sciti-ingest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node ingest/run.mjs
      - name: Commit figures
        run: |
          git config user.name "sciti ingest"
          git config user.email "actions@users.noreply.github.com"
          git add data/last-good public/data public/geo
          if git diff --cached --quiet; then
            echo "No figure changed."
          else
            git commit -m "Refresh published figures"
            git push
          fi
